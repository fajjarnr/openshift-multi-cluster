# This is a StackRox Cluster Registration Secret (CRS).
# It is used for setting up StackRox secured clusters.
# NOTE: File ini berisi kredensial — nilai CRS ASLI JANGAN di-commit.
#
# CRS dibuat dari ACS Central (UI: Secure → Cluster Init → Cluster Registration,
# atau `roxctl central ...`) dan bersifat sekali-pakai + punya masa berlaku
# (lihat annotation crs.platform.stackrox.io/expires-at).
#
# Cara isi ulang setelah deploy Central baru:
#   1. Login Central UI → Generate cluster registration secret
#   2. Ambil nilai base64 dari secret yang dihasilkan:
#      oc -n stackrox get secret cluster-registration-secret \
#        -o jsonpath='{.data.crs}' > crs.b64
#   3. Tempel ke bawah ini lalu oc apply.
apiVersion: v1
data:
  crs: <ISI_CRS_BASE64_DARI_CENTRAL>
kind: Secret
metadata:
  annotations:
    crs.platform.stackrox.io/name: hub
  name: cluster-registration-secret