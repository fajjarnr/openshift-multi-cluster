apiVersion: v1
kind: Secret
metadata:
  name: central-admin-password
  namespace: stackrox
type: Opaque
stringData:
  # Key HARUS bernama `password`. Operator membacanya lewat
  # `passwordSecret.Data["password"]` (operator/internal/central/extensions/
  # reconcile_admin_password.go) dan menolak kalau kosong, multi-line, atau
  # tidak match htpasswd yang dihasilkan:
  #   "admin password secret %s must contain a non-empty, single-line %q entry"
  #
  # Secret ini harus berada di namespace yang SAMA dengan Central — field
  # adminPasswordSecret hanya punya `name`, tanpa `namespace`
  # (LocalSecretReference), dan operator membaca dengan
  # ObjectKey{Namespace: centralObj.GetNamespace(), Name: ...}.
  #
  # GANTI password di bawah sebelum dipakai di cluster yang bisa dijangkau publik.
  password: <ISI_PASSWORD_ADMIN>
