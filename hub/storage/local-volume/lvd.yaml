apiVersion: local.storage.openshift.io/v1alpha1
kind: LocalVolumeDiscovery
metadata:
  name: auto-discover-devices
  namespace: openshift-local-storage
spec:
  # Pakai label node, bukan daftar hostname: node odf dibuat oleh MachineSet
  # (compute/machineSets/odf.yaml), jadi hostname berubah kalau node diganti.
  nodeSelector:
    nodeSelectorTerms:
      - matchExpressions:
          - key: node-role.kubernetes.io/odf
            operator: Exists
  # DaemonSet LSO mewarisi tolerations dari CR ini, bukan dari anotasi namespace.
  # Key ini harus cocok dengan taint di compute/machineSets/odf.yaml.
  tolerations:
    - key: node.ocs.openshift.io/storage
      operator: Equal
      value: "true"
      effect: NoSchedule
