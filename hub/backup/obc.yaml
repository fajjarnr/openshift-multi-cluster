# Bucket noobaa utk etcd backup — pattern sama dgn logging-loki-s3 & acm-observability:
# OBC di openshift-storage, kredensial (AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY)
# diambil dari secret generated setelah Bound.
apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  name: etcd-backup-s3
  namespace: openshift-storage
spec:
  generateBucketName: etcd-backup
  storageClassName: openshift-storage.noobaa.io
