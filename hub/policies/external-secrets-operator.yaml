apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: external-secrets-operator
  namespace: policies
  annotations:
    policy.open-cluster-management.io/standards: NIST SP 800-53
    policy.open-cluster-management.io/categories: IA Identification and Authentication
    policy.open-cluster-management.io/controls: IA-5 Authenticator Management
spec:
  disabled: false
  remediationAction: enforce
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1beta1
        kind: OperatorPolicy
        metadata:
          name: install-external-secrets-operator
        spec:
          remediationAction: enforce
          severity: high
          complianceType: musthave
          upgradeApproval: Automatic
          subscription:
            channel: stable-v1
            name: openshift-external-secrets-operator
            source: redhat-operators
            sourceNamespace: openshift-marketplace
            namespace: openshift-external-secrets
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: external-secrets-operator-healthy
        spec:
          remediationAction: enforce
          severity: high
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: operators.coreos.com/v1alpha1
                kind: ClusterServiceVersion
                metadata:
                  namespace: openshift-external-secrets
                status:
                  phase: Succeeded
              objectSelector:
                matchLabels:
                  operators.coreos.com/openshift-external-secrets-operator.openshift-external-secrets: ''
---
# Target: cluster yang pakai Vault (opt-in via label secrets=vault).
# Saat ini hanya dev. Cluster baru: label manual sebelum/sesudah apply —
# Placement dinamis, policy otomatis masuk.
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: external-secrets-operator
  namespace: policies
spec:
  clusterSets:
    - default
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchLabels:
            vendor: OpenShift
            secrets: vault
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: external-secrets-operator
  namespace: policies
placementRef:
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
  name: external-secrets-operator
subjects:
  - apiGroup: policy.open-cluster-management.io
    kind: Policy
    name: external-secrets-operator
