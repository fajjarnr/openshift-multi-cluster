# Log forwarding: ClusterLogForwarder instance -> LokiStack logging-loki.
# Spec disalin dari hub/cluster-config/logging/ (CLF, SA, RBAC).
#
# LokiStack (ODF, prod) ada di file terpisah lokistack-prod.yaml dengan
# root disabled: true — test cluster (hub/dev) sengaja tidak deploy LokiStack
# untuk hemat cost. CLF tetap di-enforce: collector jalan, pipeline menunjuk
# lokistack-out; status pipeline Degraded sampai LokiStack ada — ekspektasi.
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: log-forwarding
  namespace: policies
  annotations:
    policy.open-cluster-management.io/standards: NIST SP 800-53
    policy.open-cluster-management.io/categories: AU Audit and Accountability
    policy.open-cluster-management.io/controls: AU-9 Protection of Audit Information
spec:
  disabled: false
  remediationAction: enforce
  policy-templates:
    # RBAC collector: SA + 4 ClusterRoleBinding (ClusterRole dibuat CLO).
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: logging-collector-rbac
        spec:
          remediationAction: enforce
          severity: high
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: ServiceAccount
                metadata:
                  name: logging-collector
                  namespace: openshift-logging
            - complianceType: musthave
              objectDefinition:
                apiVersion: rbac.authorization.k8s.io/v1
                kind: ClusterRoleBinding
                metadata:
                  name: logging-collector-logs-writer
                roleRef:
                  apiGroup: rbac.authorization.k8s.io
                  kind: ClusterRole
                  name: logging-collector-logs-writer
                subjects:
                  - kind: ServiceAccount
                    name: logging-collector
                    namespace: openshift-logging
            - complianceType: musthave
              objectDefinition:
                apiVersion: rbac.authorization.k8s.io/v1
                kind: ClusterRoleBinding
                metadata:
                  name: collect-application-logs
                roleRef:
                  apiGroup: rbac.authorization.k8s.io
                  kind: ClusterRole
                  name: collect-application-logs
                subjects:
                  - kind: ServiceAccount
                    name: logging-collector
                    namespace: openshift-logging
            - complianceType: musthave
              objectDefinition:
                apiVersion: rbac.authorization.k8s.io/v1
                kind: ClusterRoleBinding
                metadata:
                  name: collect-infrastructure-logs
                roleRef:
                  apiGroup: rbac.authorization.k8s.io
                  kind: ClusterRole
                  name: collect-infrastructure-logs
                subjects:
                  - kind: ServiceAccount
                    name: logging-collector
                    namespace: openshift-logging
            - complianceType: musthave
              objectDefinition:
                apiVersion: rbac.authorization.k8s.io/v1
                kind: ClusterRoleBinding
                metadata:
                  name: collect-audit-logs
                roleRef:
                  apiGroup: rbac.authorization.k8s.io
                  kind: ClusterRole
                  name: collect-audit-logs
                subjects:
                  - kind: ServiceAccount
                    name: logging-collector
                    namespace: openshift-logging
    # ClusterLogForwarder: kumpulkan application+infrastructure+audit,
    # teruskan ke LokiStack logging-loki. Tolerations infra/ODF dari yaml hub
    # di-strip: label/taint itu tidak ada di test cluster (toleration ekstra
    # harmless, tapi spec policy harus drift-bersih vs kebutuhan real).
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: cluster-log-forwarder
        spec:
          remediationAction: enforce
          severity: high
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: observability.openshift.io/v1
                kind: ClusterLogForwarder
                metadata:
                  name: instance
                  namespace: openshift-logging
                spec:
                  managementState: Managed
                  collector:
                    tolerations:
                      - key: node-role.kubernetes.io/master
                        operator: Exists
                        effect: NoSchedule
                  outputs:
                    - lokiStack:
                        authentication:
                          token:
                            from: serviceAccount
                        target:
                          name: logging-loki
                          namespace: openshift-logging
                      name: lokistack-out
                      tls:
                        ca:
                          configMapName: openshift-service-ca.crt
                          key: service-ca.crt
                      type: lokiStack
                  pipelines:
                    - inputRefs:
                        - application
                        - infrastructure
                        - audit
                      name: all-logs
                      outputRefs:
                        - lokistack-out
                  serviceAccount:
                    name: logging-collector
---
# Target: semua OCP (hub+dev). CLF per-cluster menunjuk LokiStack lokal
# masing-masing; tidak ada forwarding lintas cluster di desain ini.
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: log-forwarding
  namespace: policies
spec:
  clusterSets:
    - default
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchLabels:
            vendor: OpenShift
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: log-forwarding
  namespace: policies
placementRef:
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
  name: log-forwarding
subjects:
  - apiGroup: policy.open-cluster-management.io
    kind: Policy
    name: log-forwarding
