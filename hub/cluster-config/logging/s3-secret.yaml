kind: Secret
apiVersion: v1
metadata:
  name: logging-loki-s3
  namespace: openshift-logging
stringData:
  # Isi dari secret OBC logging-loki-s3 di ns openshift-storage
  # (keys AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY). JANGAN commit nilai asli.
  access_key_id: <ISI_AWS_ACCESS_KEY_ID>
  access_key_secret: <ISI_AWS_SECRET_ACCESS_KEY>
  bucketnames: <ISI_BUCKET_DARI_OBC>
  endpoint: https://s3.openshift-storage.svc:443
