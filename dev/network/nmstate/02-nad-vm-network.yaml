# JANGAN APPLY di dev — pasangan dari 01-nncp-vm-network-bond.yaml.
# NAD bridge Multus untuk VM KubeVirt (interface bridge atas br-vm100/200).
# Ipam Whereabouts dengan range per VLAN; sesuaikan subnet + range.
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: vm-net-100
  namespace: openshift-cnv
spec:
  config: >-
    {
      "cniVersion": "0.3.1",
      "name": "vm-net-100",
      "type": "bridge",
      "bridge": "br-vm100",
      "ipam": {
        "type": "whereabouts",
        "range": "192.168.100.0/24"
      }
    }
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: vm-net-200
  namespace: openshift-cnv
spec:
  config: >-
    {
      "cniVersion": "0.3.1",
      "name": "vm-net-200",
      "type": "bridge",
      "bridge": "br-vm200",
      "ipam": {
        "type": "whereabouts",
        "range": "192.168.200.0/24"
      }
    }
