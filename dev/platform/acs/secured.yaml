apiVersion: platform.stackrox.io/v1alpha1
kind: SecuredCluster
metadata:
  name: stackrox-secured-cluster-services
  namespace: stackrox
spec:
  # Sensor bicara gRPC ke Central lewat passthrough route (TLS mentah sampai
  # ke pod Central — HAProxy tidak memutus koneksi). Route re-encrypt tetap
  # dipakai UI browser, tapi JANGAN untuk sensor: HAProxy memutus gRPC
  # (400 Bad request). wss:// juga bisa lewat re-encrypt, tapi https murni
  # lewat passthrough lebih disukai.
  centralEndpoint: https://central-stackrox.apps.hub.ocp.fajjjar.my.id:443
  # Harus unik di Central — "hub" sudah dipakai SecuredCluster milik hub.
  clusterName: dev
  admissionControl:
    replicas: 3
    resources:
      requests:
        cpu: 50m
        memory: 100Mi
      limits:
        cpu: 500m
        memory: 500Mi
  sensor:
    resources:
      requests:
        cpu: '1'
        memory: 1Gi
      limits:
        cpu: '2'
        memory: 4Gi
  perNode:
    collector:
      collection: EBPF
      imageFlavor: Slim
    taintToleration: TolerateTaints
  scanner:
    scannerComponent: AutoSense
  scannerV4:
    scannerComponent: AutoSense
    db:
      persistence:
        persistentVolumeClaim:
          claimName: scanner-v4-db
          size: '100'
          storageClassName: ocs-storagecluster-ceph-rbd
