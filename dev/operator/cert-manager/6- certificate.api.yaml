apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: api-server-certificate-prod
  namespace: openshift-config
spec:
  secretName: api-server-tls-secret
  commonName: api.dev.ocp.fajjjar.my.id
  dnsNames:
    - api.dev.ocp.fajjjar.my.id
  privateKey:
    algorithm: RSA
    size: 2048
    rotationPolicy: Never
  duration: 720h # 30d
  renewBefore: 168h # 7d
  issuerRef:
    name: letsencrypt-prod-issuer
    kind: ClusterIssuer
    group: cert-manager.io
