apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ingress-certificate-prod
  namespace: openshift-ingress
spec:
  secretName: app-router-certs
  duration: 720h # 30d
  renewBefore: 168h # 7d
  privateKey:
    rotationPolicy: Never
  dnsNames:
    - '*.apps.dev.ocp.fajjjar.my.id'
  issuerRef:
    name: letsencrypt-prod-issuer
    kind: ClusterIssuer
    group: cert-manager.io
