replicas: 3
defaultRoute: true
rolloutStrategy: Recreate
managementState: Managed
storage:
  managementState: Unmanaged
  pvc:
    claim: image-registry-storage
nodeSelector:
  node-role.kubernetes.io/infra: ''
tolerations:
  - key: infra
    value: node
    effect: NoSchedule
  - key: infra
    value: node
    effect: NoExecute

